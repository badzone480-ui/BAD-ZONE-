<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAD ZONE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#050505;
  color:white;
  min-height:100vh;
}

header{
  height:65px;
  background:#080808;
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:#00aaff;
}

.icon{
  font-size:22px;
}

.container{
  max-width:600px;
  margin:auto;
  padding-bottom:80px;
}

.story{
  display:flex;
  gap:15px;
  overflow-x:auto;
  padding:15px;
  border-bottom:1px solid #222;
}

.story::-webkit-scrollbar{
  display:none;
}

.story-user{
  min-width:65px;
  text-align:center;
  font-size:12px;
}

.story-circle{
  width:55px;
  height:55px;
  border-radius:50%;
  margin:auto;
  margin-bottom:5px;
  background:linear-gradient(135deg,#00aaff,#7b00ff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  border:2px solid #00aaff;
}

.create{
  margin:15px;
  padding:15px;
  background:#0d0d0d;
  border:1px solid #222;
  border-radius:15px;
}

.create textarea{
  width:100%;
  height:70px;
  resize:none;
  background:#151515;
  border:0;
  border-radius:10px;
  padding:12px;
  color:white;
  outline:none;
}

.post-btn{
  margin-top:10px;
  width:100%;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#008cff;
  color:white;
  font-weight:bold;
  font-size:15px;
}

.post{
  margin:15px;
  background:#0d0d0d;
  border:1px solid #222;
  border-radius:15px;
  overflow:hidden;
}

.post-head{
  display:flex;
  align-items:center;
  padding:12px;
  gap:10px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:linear-gradient(135deg,#008cff,#7700ff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.username{
  font-weight:bold;
}

.time{
  color:#777;
  font-size:12px;
}

.post-text{
  padding:0 12px 12px;
  line-height:1.5;
}

.post-image{
  width:100%;
  height:280px;
  background:linear-gradient(135deg,#111,#252525);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
}

.actions{
  display:flex;
  justify-content:space-around;
  padding:12px;
  border-top:1px solid #222;
}

.actions button{
  background:none;
  border:0;
  color:#aaa;
  font-size:15px;
}

.actions button:hover{
  color:#00aaff;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#080808;
  border-top:1px solid #222;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

nav button{
  background:none;
  border:0;
  color:#aaa;
  font-size:22px;
}

nav button.active{
  color:#00aaff;
}

.profile{
  display:none;
  padding:25px 15px;
  text-align:center;
}

.profile-avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:linear-gradient(135deg,#008cff,#7700ff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
  font-weight:bold;
  margin:10px auto;
}

.profile h2{
  margin:10px;
}

.stats{
  display:flex;
  justify-content:space-around;
  margin:25px 0;
}

.stat strong{
  display:block;
  font-size:20px;
}

.stat span{
  color:#777;
  font-size:12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">BAD <span>ZONE</span></div>
  <div class="icon">🔔</div>
</header>

<div class="container">

<section id="home">

<div class="story">

<div class="story-user">
<div class="story-circle">+</div>
Your Story
</div>

<div class="story-user">
<div class="story-circle">B</div>
BadBoy
</div>

<div class="story-user">
<div class="story-circle">A</div>
Alpha
</div>

<div class="story-user">
<div class="story-circle">Z</div>
Zone
</div>

<div class="story-user">
<div class="story-circle">K</div>
King
</div>

</div>

<div class="create">

<textarea id="postText"
placeholder="What's happening in BAD ZONE?"></textarea>

<button class="post-btn" onclick="createPost()">
Post
</button>

</div>

<div id="posts">

<div class="post">

<div class="post-head">

<div class="avatar">BZ</div>

<div>
<div class="username">BAD ZONE</div>
<div class="time">Just now</div>
</div>

</div>

<div class="post-text">
Welcome to BAD ZONE 🚀  
Connect • Share • Grow
</div>

<div class="post-image">
🔥
</div>

<div class="actions">

<button onclick="likePost(this)">❤️ <span>0</span></button>

<button>💬 Comment</button>

<button>↗ Share</button>

</div>

</div>

</div>

</section>


<section class="profile" id="profile">

<div class="profile-avatar">
BZ
</div>

<h2>BAD ZONE USER</h2>

<p style="color:#777;">Building the future 🚀</p>

<div class="stats">

<div class="stat">
<strong id="postCount">0</strong>
<span>Posts</span>
</div>

<div class="stat">
<strong>0</strong>
<span>Followers</span>
</div>

<div class="stat">
<strong>0</strong>
<span>Following</span>
</div>

</div>

<button class="post-btn">
Edit Profile
</button>

</section>

</div>


<nav>

<button class="active" onclick="showHome(this)">🏠</button>

<button onclick="showHome(this)">🔍</button>

<button onclick="showHome(this)">➕</button>

<button onclick="showProfile(this)">👤</button>

</nav>


<script>

let postCount = 0;

function createPost(){

const text =
document.getElementById("postText").value.trim();

if(text === ""){
alert("Andika kitu kwanza.");
return;
}

const post = document.createElement("div");

post.className="post";

post.innerHTML=`

<div class="post-head">

<div class="avatar">ME</div>

<div>
<div class="username">You</div>
<div class="time">Just now</div>
</div>

</div>

<div class="post-text">
${text}
</div>

<div class="actions">

<button onclick="likePost(this)">
❤️ <span>0</span>
</button>

<button>💬 Comment</button>

<button>↗ Share</button>

</div>

`;

document.getElementById("posts").prepend(post);

document.getElementById("postText").value="";

postCount++;

document.getElementById("postCount").innerText=postCount;

}

function likePost(button){

let number =
button.querySelector("span");

let count =
parseInt(number.innerText);

number.innerText=count+1;

button.style.color="#008cff";

}

function showProfile(button){

document.getElementById("home").style.display="none";

document.getElementById("profile").style.display="block";

setActive(button);

}

function showHome(button){

document.getElementById("home").style.display="block";

document.getElementById("profile").style.display="none";

setActive(button);

}

function setActive(button){

document.querySelectorAll("nav button")
.forEach(btn=>btn.classList.remove("active"));

button.classList.add("active");

}

</script>

</body>
</html>
